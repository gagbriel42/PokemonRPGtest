name: Build real HGSS assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'rom-parts/**'
      - 'tools/hgss/**'
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble SoulSilver
        run: python3 tools/hgss/reassemble_rom_parts.py --out /tmp/SoulSilver.nds
      - name: Extract NitroFS and maps
        run: python3 tools/hgss/extract_rom.py /tmp/SoulSilver.nds --out /tmp/hgss-generated --maps 30,57
      - name: Correctly parse HGSS map containers
        run: python3 tools/hgss/reparse_mapbin.py /tmp/hgss-generated/nitrofs/a/0/6/5 --maps 30,57 --out /tmp/hgss-corrected
      - name: Package map and graphics sources
        run: |
          mkdir -p /tmp/hgss-assets
          cp -a /tmp/hgss-corrected/maps /tmp/hgss-assets/
          for d in a/0/4/1 a/0/4/2 a/0/4/3 a/0/4/4 a/0/5/8 a/0/6/5; do
            if [ -e "/tmp/hgss-generated/nitrofs/$d" ]; then
              mkdir -p "/tmp/hgss-assets/nitrofs/$(dirname "$d")"
              cp -a "/tmp/hgss-generated/nitrofs/$d" "/tmp/hgss-assets/nitrofs/$d"
            fi
          done
          find /tmp/hgss-assets -type f -printf '%p %s bytes\n' | sort > /tmp/hgss-assets/manifest.txt
      - name: Upload real HGSS sources
        uses: actions/upload-artifact@v4
        with:
          name: hgss-route29-real-assets
          path: /tmp/hgss-assets
          if-no-files-found: error
