name: Deploy Pokémon RPG to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ALL real HGSS assets for the web bundle
        env:
          HGSS_ROM: /tmp/SoulSilver.nds
          HGSS_MAPS: "auto"
        run: |
          set -euo pipefail
          mkdir -p /tmp
          rm -f /tmp/SoulSilver.nds
          PARTS=(rom-parts/soulSilver.part*)
          if [ ! -e "${PARTS[0]}" ]; then
            echo "ERREUR: rom-parts/soulSilver.partXXX introuvable"
            exit 1
          fi
          for part in "${PARTS[@]}"; do
            cat "$part" >> /tmp/SoulSilver.nds
          done
          test "$(stat -c%s /tmp/SoulSilver.nds)" -gt 100000000
          python3 tools/hgss/build_real_assets.py
          test -s apps/web/public/assets/hgss/generated/map-render-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/web/public/assets/hgss/generated/map-render-manifest.json')
          d=json.loads(p.read_text())
          print(f"HGSS: {d['countBuilt']} rendus construits, {d['countMissing']} manquants")
          if d['countBuilt'] == 0:
              raise SystemExit('Aucun rendu HGSS construit')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build --workspace=apps/web

      - name: Verify HGSS assets are in the Pages bundle
        run: |
          set -euo pipefail
          test -s apps/web/dist/assets/hgss/generated/map-render-manifest.json
          test -f apps/web/dist/assets/hgss/generated/maps/30/nsbmd.bin
          test -f apps/web/dist/assets/hgss/generated/maps/30/rendered/nsbmd.glb
          test -f apps/web/dist/assets/hgss/generated/maps/57/nsbmd.bin
          test -f apps/web/dist/assets/hgss/generated/maps/57/rendered/nsbmd.glb
          echo "HGSS manifest, modèles et données présents dans dist/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
